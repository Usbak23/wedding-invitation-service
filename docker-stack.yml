services:
  wedding-service:
    image: ${APP_IMAGE}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-3010}
      PORT: ${PORT:-3010}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SWAGGER_ENV: ${SWAGGER_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-wedding-invitation-db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-wedding}
      S3_REGION: ${S3_REGION:-us-east-1}
    networks:
      - agilix_network
    ports:
      - target: ${PORT:-3010}
        published: ${PORT:-3010}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-3010}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.15'
          memory: 128M

networks:
  agilix_network:
    external: true